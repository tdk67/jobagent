version: "3.8"

services:
  jobagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobagent
    restart: unless-stopped
    ports:
      # Loopback-only publish: the gateway serves a local-first PII API (profile,
      # CV documents). To expose deliberately on the LAN, override the port
      # mapping (e.g. "8765:8765") — the Host-header guard inside the gateway
      # will still reject non-loopback Host names.
      - "127.0.0.1:8765:8765"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      # Default loopback bind; override intentionally (e.g. set A2A_HOST to the
      # LAN interface) only when the Host-header guard on the gateway has been
      # relaxed — the guard below rejects non-loopback Host names anyway.
      - A2A_HOST=127.0.0.1
    env_file:
      - path: .env
        required: false
    volumes:
      # Persistent local database, job archives, and PDF snapshots
      - ./data:/app/data
      # Compliance PDF reports and dashboards
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
