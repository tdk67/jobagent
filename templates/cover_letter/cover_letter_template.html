<!DOCTYPE html>
<html lang="{{ LANG }}">
<head>
<meta charset="UTF-8">
<style>
  @page {
    size: A4;
    margin: 22mm 22mm 22mm 22mm;
  }
  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11pt;
    line-height: 1.55;
    color: #222;
    margin: 0;
    padding: 0;
  }
  .header {
    border-bottom: 2px solid #0056b3;
    padding-bottom: 10px;
    margin-bottom: 20px;
  }
  .name {
    font-size: 18pt;
    font-weight: bold;
    color: #0056b3;
    margin: 0 0 4px 0;
  }
  .contact-info {
    font-size: 9.5pt;
    color: #555;
  }
  .recipient {
    margin-bottom: 18px;
    font-size: 10.5pt;
    line-height: 1.35;
  }
  .date {
    margin-bottom: 16px;
    font-size: 10pt;
    color: #555;
    text-align: right;
  }
  .subject {
    font-size: 12.5pt;
    font-weight: bold;
    color: #111;
    margin-bottom: 16px;
  }
  p {
    margin: 0 0 13px 0;
    text-align: justify;
  }
  .signature {
    margin-top: 22px;
  }
  .signature-name {
    font-weight: bold;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="name">{{ SENDER_NAME }}</div>
    <div class="contact-info">
      {{ SENDER_CONTACT }}
    </div>
  </div>

  <div class="recipient">
    {{ RECIPIENT }}
  </div>

  <div class="date">
    {{ DATE }}
  </div>

  <div class="subject">
    {{ SUBJECT }}
  </div>

  <div class="body">
    {{ BODY }}
  </div>

  <div class="signature">
    {{ CLOSING }}<br>
    <div class="signature-name">{{ SENDER_NAME }}</div>
  </div>
</body>
</html>
